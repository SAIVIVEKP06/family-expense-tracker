<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Family Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>Family Expense Tracker</h1>
            <p>Track and manage your family expenses easily</p>
        </header>

        <section class="summary">
            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="totalExpense">₹0</p>
            </div>

            <div class="summary-card">
                <h3>This Month</h3>
                <p id="monthlyExpense">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Transactions</h3>
                <p id="transactionCount">0</p>
            </div>
        </section>

        <section class="expense-form">

            <h2>Add New Expense</h2>

            <form id="expenseForm">

                <div class="form-group">
                    <label for="expenseName">Expense Name</label>
                    <input
                        type="text"
                        id="expenseName"
                        placeholder="Example: Groceries"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="member">Family Member</label>

                    <select id="member" required>
                        <option value="">Select member</option>
                        <option value="Father">Father</option>
                        <option value="Mother">Mother</option>
                        <option value="Son">Son</option>
                        <option value="Daughter">Daughter</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" required>
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Travel">Travel</option>
                        <option value="Bills">Bills</option>
                        <option value="Education">Education</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>

                    <input
                        type="date"
                        id="date"
                        required
                    >
                </div>

                <button type="submit">Add Expense</button>

            </form>

        </section>

        <section class="expense-list">

            <div class="section-header">
                <h2>Recent Expenses</h2>

                <select id="filterCategory">
                    <option value="All">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Travel">Travel</option>
                    <option value="Bills">Bills</option>
                    <option value="Education">Education</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div id="expenseList">
                <p class="empty-message">
                    No expenses added yet.
                </p>
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
